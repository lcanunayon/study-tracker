<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    .overlay-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .overlay-card {
      background: rgba(10, 10, 14, 0.90);
      border: 1.5px solid rgba(255, 255, 255, 0.10);
      border-radius: 28px;
      padding: 44px 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      animation:
        cardIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        cardOut 0.55s ease-in 3.5s forwards;
      will-change: transform, opacity;
    }

    .overlay-card.work {
      border-color: rgba(0, 212, 255, 0.28);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.75),
        0 0 70px rgba(0, 212, 255, 0.07);
    }

    .overlay-card.break {
      border-color: rgba(139, 92, 246, 0.28);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.75),
        0 0 70px rgba(139, 92, 246, 0.07);
    }

    .overlay-emoji {
      font-size: 90px;
      line-height: 1;
    }

    .overlay-card.work .overlay-emoji {
      animation: ringBell 0.45s ease-in-out infinite alternate;
      animation-delay: 0.7s;
      animation-play-state: paused;
    }

    .overlay-card.break .overlay-emoji {
      animation: sleepFloat 2.2s ease-in-out infinite;
      animation-delay: 0.7s;
      animation-play-state: paused;
    }

    .overlay-card.animate-emoji .overlay-emoji {
      animation-play-state: running;
    }

    .overlay-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .overlay-sublabel {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.50);
      text-align: center;
      line-height: 1.4;
    }

    @keyframes cardIn {
      from { transform: translateX(-130vw); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    @keyframes cardOut {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(130vw); opacity: 0; }
    }

    @keyframes ringBell {
      from { transform: rotate(-10deg) scale(1); }
      to   { transform: rotate(10deg) scale(1.08); }
    }

    @keyframes sleepFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="overlay-wrapper">
    <div class="overlay-card" id="card">
      <div class="overlay-emoji" id="emoji"></div>
      <div class="overlay-label" id="label"></div>
      <div class="overlay-sublabel" id="sublabel"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');

    const card = document.getElementById('card');
    const emoji = document.getElementById('emoji');
    const label = document.getElementById('label');
    const sublabel = document.getElementById('sublabel');

    if (type === 'work') {
      card.classList.add('work');
      emoji.textContent = '⏰';
      label.textContent = 'Time to Work!';
      sublabel.textContent = "Break is over — let’s get focused";
    } else {
      card.classList.add('break');
      emoji.textContent = '😴';
      label.textContent = 'Time to Rest!';
      sublabel.textContent = "Great work — enjoy your break";
    }

    // Start emoji animation after slide-in completes
    setTimeout(() => card.classList.add('animate-emoji'), 700);
  </script>
</body>
</html>
